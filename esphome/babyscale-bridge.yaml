# M5Stack NanoC6 (ESP32-C6) bridge for the Greater Goods baby scale (BS1711-B).
# Wi-Fi is set on site: with no saved network the M5 opens hotspot "babyscale-bridge".
# Join it from a phone (no password) and pick the home network.
# No secrets are compiled in: Wi-Fi is set on site, and updates arrive over HTTPS from the app
# (GitHub Actions builds each version; see .github/workflows/firmware.yml).
# LED (NanoC6 RGB): blue = connected to the scale, green flash = reading saved, red flash = upload failed.
substitutions:
  fw_version: "dev"  # CI passes -s fw_version 2.1.<run>; "dev" builds update to the published one

esphome:
  name: babyscale-bridge
  project:
    name: jacobmr.babyscale-bridge
    version: ${fw_version}

  # The bridge's own key, made once on first boot and kept in flash. The app trusts the first key
  # a bridge sends, so readings can't be forged by someone who only knows the MAC.
  on_boot:
    priority: 600
    then:
      - lambda: |-
          if (id(key_hi) == 0 && id(key_lo) == 0) {
            id(key_hi) = ((uint64_t) random_uint32() << 32) | random_uint32();
            id(key_lo) = ((uint64_t) random_uint32() << 32) | random_uint32();
          }
      # Globals save on the next loop; then write flash now, not at the 60 s flush:
      # a lost key would lock the bridge out.
      - delay: 2s
      - lambda: global_preferences->sync();
      - output.turn_on: led_power

globals:
  - id: key_hi
    type: uint64_t
    restore_value: true
    initial_value: "0"
  - id: key_lo
    type: uint64_t
    restore_value: true
    initial_value: "0"

script:
  # The scale sends one measurement record after it auto-holds a steady weight; post it right away.
  # A repeat within 120 s merges into the same entry on the server.
  - id: post_weight
    mode: queued
    then:
      - http_request.post:
          url: https://babyscale.vercel.app/api/ingest
          request_headers:
            Content-Type: application/json
          json: |-
            char key[33];
            snprintf(key, sizeof key, "%016llx%016llx", (unsigned long long) id(key_hi), (unsigned long long) id(key_lo));
            root["bridge_id"] = get_mac_address();
            root["key"] = key;
            root["grams"] = (int) id(weight_sensor).state;
            root["measured_at"] = id(sntp_time).now().timestamp;
            root["version"] = "${fw_version}";
          on_response:
            then:
              - logger.log:
                  level: INFO
                  format: "ingest %d g -> HTTP %d"
                  args: ["(int) id(weight_sensor).state", response->status_code]
              - if:
                  condition:
                    lambda: return response->status_code >= 200 && response->status_code < 300;
                  then:
                    - script.execute: { id: flash_led, red: 0.0, green: 1.0, blue: 0.0 }
                  else:
                    - script.execute: { id: flash_led, red: 1.0, green: 0.0, blue: 0.0 }
          on_error:
            then:
              - script.execute: { id: flash_led, red: 1.0, green: 0.0, blue: 0.0 }

  # Shows a color for 3 s, then the steady state: blue while connected to the scale, else off.
  - id: flash_led
    mode: restart
    parameters:
      red: float
      green: float
      blue: float
    then:
      - light.turn_on: { id: status_led, red: !lambda return red;, green: !lambda return green;, blue: !lambda return blue;, brightness: 60%, transition_length: 0s }
      - delay: 3s
      - script.execute: led_idle

  - id: led_idle
    then:
      - if:
          condition:
            lambda: return id(scale_client).connected();
          then:
            - light.turn_on: { id: status_led, red: 0.0, green: 0.0, blue: 1.0, brightness: 25%, transition_length: 0s }
          else:
            - light.turn_off: { id: status_led, transition_length: 0s }

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

wifi:
  ap:
    ssid: babyscale-bridge  # open: it only runs until a home network is saved
  # One radio: BLE scanning starves the setup hotspot, so Bluetooth starts only once Wi-Fi is up.
  on_connect:
    - ble.enable:

esp32_ble:
  enable_on_boot: false

captive_portal:

# HTTPS to the web app; ESP-IDF checks the server certificate against its built-in CA bundle.
http_request:
  verify_ssl: true
  timeout: 10s

ota:
  - platform: http_request

# Every 6 h: if the app publishes a newer version, install it.
update:
  - platform: http_request
    id: fw_update
    name: Firmware
    source: https://babyscale.vercel.app/firmware/manifest.json
    update_interval: 6h

interval:
  - interval: 6h
    startup_delay: 2min
    then:
      - component.update: fw_update
      - delay: 30s
      - if:
          condition:
            update.is_available: fw_update
          then:
            - logger.log: { level: INFO, format: "Installing firmware update" }
            - update.perform: fw_update

# Real clock for the scale's set-time command and reading timestamps (unix time, UTC).
time:
  - platform: sntp
    id: sntp_time

logger:
  level: INFO
  logs:
    esp32_ble_tracker: INFO

external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    # The scale's MAC isn't known in advance (macOS hides it), so adopt the first BS1711-B we see.
    - then:
        - lambda: |-
            if (id(scale_client).get_address() == 0 && x.get_name() == "BS1711-B") {
              ESP_LOGI("ggscale", "Found scale at %s", x.address_str().c_str());
              id(scale_client).set_address(x.address_uint64());
            }

ble_client:
  - id: scale_client
    mac_address: "00:00:00:00:00:00"  # replaced at runtime by the lambda above
    on_connect:
      - script.execute: led_idle
    on_disconnect:
      - script.execute: led_idle

# NanoC6 RGB LED: WS2812 on GPIO20, powered through GPIO19.
output:
  - platform: gpio
    id: led_power
    pin: GPIO19

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s

ggscale:
  ble_client_id: scale_client
  weight:
    id: weight_sensor
    name: Baby weight
    on_value:
      - script.execute: post_weight
  battery_level:
    name: Scale battery
  display_unit:
    name: Scale display unit
